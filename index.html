<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прыгающий Мальчик (Мобильная версия)</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #111;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            touch-action: none; /* Отключаем зум и скролл */
        }
        canvas {
            background-color: #87CEEB;
            display: block;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        boy.y = height - groundHeight - boy.height;
    });

    const images = {
        bg: new Image(),
        boy: new Image(),
        rock: new Image(),
        puddle: new Image(),
        woman: new Image()
    };

    images.bg.src = 'bg.png';
    images.boy.src = 'boy.png';
    images.rock.src = 'rock.png';
    images.puddle.src = 'puddle.png';
    images.woman.src = 'woman.png';

    let gameLoop;
    let score = 0;
    let obstacles = [];
    let frameCounter = 0;
    
    // --- СКОРОСТЬ (Привязана к ширине экрана, чтобы на телефоне не летало) ---
    // 0.006 означает, что за секунду экран пересекается примерно за 6 секунд
    let baseGameSpeed = width * 0.006; 
    let gameSpeed = baseGameSpeed;
    
    let isGameOver = false;
    let isAlternateBg = false;

    // --- НАСТРОЙКИ ПЕРСОНАЖА (Еще больше размер) ---
    const boy = {
        x: width * 0.15, // Чуть левее, чтобы было больше времени на реакцию
        y: 0,
        width: 110,      // Увеличен размер (было 80)
        height: 160,     // Увеличен размер (было 120)
        vy: 0,
        gravity: 0.8,    // Чуть меньше гравитация для плавности
        jumpForce: -18,  // Прыжок сбалансирован под новую гравитацию
        isJumping: false
    };

    // --- ФОН И ЗЕМЛЯ ---
    let bgX = 0;
    const groundHeight = height * 0.25; 
    boy.y = height - groundHeight - boy.height + 20;

    function handleJump(e) {
        if (e) e.preventDefault();
        if (isGameOver) { resetGame(); return; }
        if (!boy.isJumping) { 
            boy.vy = boy.jumpForce; 
            boy.isJumping = true; 
        }
    }

    canvas.addEventListener('mousedown', handleJump);
    canvas.addEventListener('touchstart', handleJump, {passive: false});

    function spawnObstacle() {
        frameCounter++;
        let type = 'rock';
        let isMoving = false;
        let obsWidth = 70, obsHeight = 50;

        if (frameCounter % 10 === 0) {
            type = 'woman';
            isMoving = true;
            obsWidth = 70; obsHeight = 150;
        } else {
            type = Math.random() > 0.5 ? 'rock' : 'puddle';
            if (type === 'rock') { obsWidth = 80; obsHeight = 60; }
            else { obsWidth = 100; obsHeight = 50; }
        }

        let obsY = height - groundHeight - obsHeight + (type === 'woman' ? 25 : 15);

        obstacles.push({
            x: width + 50,
            y: obsY,
            width: obsWidth,
            height: obsHeight,
            type: type,
            isMoving: isMoving,
            passed: false
        });
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        // --- 1. ОТРИСОВКА ДВИЖУЩЕГОСЯ ФОНА ---
        if (images.bg.complete && images.bg.naturalWidth > 0) {
            let scale = Math.max(width / images.bg.width, height / images.bg.height);
            let bgW = images.bg.width * scale;
            let bgH = images.bg.height * scale;
            let bgY = (height - bgH) / 2;

            ctx.drawImage(images.bg, bgX, bgY, bgW, bgH);
            ctx.drawImage(images.bg, bgX + bgW, bgY, bgW, bgH);

            if (isAlternateBg) {
                ctx.fillStyle = 'rgba(0, 0, 60, 0.5)'; 
                ctx.fillRect(0, 0, width, height);
            }
        } else {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, width, height);
        }

        // --- 2. ОТРИСОВКА ПЕРСОНАЖА ---
        if (images.boy.complete && images.boy.naturalWidth > 0) {
            ctx.drawImage(images.boy, boy.x, boy.y, boy.width, boy.height);
        } else {
            ctx.fillStyle = 'blue';
            ctx.fillRect(boy.x, boy.y, boy.width, boy.height);
        }

        // --- 3. ОТРИСОВКА ПРЕПЯТСТВИЙ ---
        obstacles.forEach(obs => {
            let img = images[obs.type];
            if (img.complete && img.naturalWidth > 0) {
                if (isAlternateBg) {
                    ctx.filter = 'brightness(1.6) contrast(1.2)'; 
                } else {
                    ctx.filter = 'none';
                }
                ctx.drawImage(img, obs.x, obs.y, obs.width, obs.height);
                ctx.filter = 'none';
            } else {
                ctx.fillStyle = 'red';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }
        });

        // --- 4. ОТРИСОВКА СЧЁТА ---
        ctx.fillStyle = isAlternateBg ? 'white' : 'black';
        ctx.font = `bold ${width * 0.08}px Arial`;
        ctx.fillText('Очки: ' + score, 20, height * 0.1);

        // --- 5. ЭКРАН ПРОИГРЫША ---
        if (isGameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = 'white';
            ctx.font = `bold ${width * 0.1}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('Игра Окончена', width / 2, height / 2 - 20);
            ctx.font = `${width * 0.06}px Arial`;
            ctx.fillText('Нажми, чтобы начать заново', width / 2, height / 2 + 40);
            ctx.textAlign = 'left';
        }
    }

    function update() {
        if (isGameOver) return;

        // Физика прыжка
        boy.y += boy.vy;
        boy.vy += boy.gravity;

        // Приземление
        if (boy.y > height - groundHeight - boy.height + 20) {
            boy.y = height - groundHeight - boy.height + 20;
            boy.vy = 0;
            boy.isJumping = false;
        }

        // --- ДВИЖЕНИЕ ФОНА ---
        if (images.bg.complete && images.bg.naturalWidth > 0) {
            let scale = Math.max(width / images.bg.width, height / images.bg.height);
            let bgW = images.bg.width * scale;
            
            bgX -= gameSpeed / 2; // Фон едет медленнее (эффект параллакса)
            
            if (bgX <= -bgW) {
                bgX = 0;
            }
        }

        // --- ДВИЖЕНИЕ ПРЕПЯТСТВИЙ ---
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;
            
            if (obs.isMoving) {
                obs.x -= (gameSpeed * 0.3); // Женщина движется быстрее, но не в 2 раза
            }

            if (!obs.passed && obs.x + obs.width < boy.x) {
                obs.passed = true;
                score++;
                
                if (score % 10 === 0) {
                    isAlternateBg = !isAlternateBg; 
                }

                // Увеличение скорости каждые 5 очков (очень плавное)
                if (score % 5 === 0) {
                    gameSpeed += (width * 0.0005); 
                }
            }

            let hitBoxPadding = 25; // Увеличенное прощение за размер персонажа
            if (
                boy.x + boy.width - hitBoxPadding > obs.x &&
                boy.x + hitBoxPadding < obs.x + obs.width &&
                boy.y + boy.height - hitBoxPadding > obs.y &&
                boy.y + hitBoxPadding < obs.y + obs.height
            ) {
                isGameOver = true;
            }

            if (obs.x + obs.width < -100) {
                obstacles.splice(i, 1);
            }
        }

        if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < width - (width * 0.7)) {
            if (frameCounter % 10 === 9 && obstacles.length > 0) {
                 // Пропускаем
            } else {
                spawnObstacle();
            }
        }
    }

    function gameStep() {
        update();
        draw();
        gameLoop = requestAnimationFrame(gameStep);
    }

    function resetGame() {
        score = 0; 
        gameSpeed = baseGameSpeed; 
        obstacles = []; 
        frameCounter = 0;
        isGameOver = false; 
        isAlternateBg = false;
        boy.y = height - groundHeight - boy.height + 20; 
        boy.vy = 0; 
        boy.isJumping = false;
        bgX = 0;
        gameStep();
    }

    window.onload = () => {
        setTimeout(() => {
            gameStep();
        }, 100);
    };
</script>
</body>
</html>
